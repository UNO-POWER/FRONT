server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad basicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Assets con hash en el nombre: cache agresiva e inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA con React Router: cualquier ruta profunda (/partida/ABC123, /salas, ...)
    # debe servir index.html; sin esto, un refresh en produccion da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
