name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck + build de produccion (tsc --noEmit && vite build)
        run: npm run build

      - name: Publicar bundle como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Imagen Docker construible
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen (valida el Dockerfile multi-stage)
        run: docker build -t uno-front:ci .
